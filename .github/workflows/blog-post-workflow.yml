name: Latest blog post workflow

on:
  schedule:
    # 每天每 12 小时自动同步一次 (UTC 0, 12)
    - cron: '0 */12 * * *'
  workflow_dispatch: # 支持手动一键触发

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Pull in WordPress Posts
        uses: gautamkrishnar/blog-post-workflow@v1
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=5000"
        with:
          feed_list: "https://sevenfriends.xtkx.site/feed/"
          max_post_count: 5
          date_format: "yyyy-mm-dd"
          template: "$newline- [$title]($url) - `$date`"
          retry_count: 5
          retry_wait_time: 10
